[project]
name = "debate-api"
version = "0.1.0"
description = "FastAPI: REST + WebSocket nad grafem debaty"
requires-python = ">=3.12"
dependencies = [
    "debate-core",
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
debate-api = "debate_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_api"]
