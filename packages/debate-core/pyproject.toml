[project]
name = "debate-core"
version = "0.1.0"
description = "Logika debaty: schemat, prompty, graf LangGraph, kanał reżysera"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
debate = "debate_core.cli:main"

[project.optional-dependencies]
google = [
    "langchain-google-genai>=4.5.0",
]
mistral = [
    "langchain-mistralai>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_core"]
